version: 2

models:
  - name: dim_customers
    description: "Core dimensional table for customers enriched with lifetime metrics."
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null

  - name: fct_orders
    description: "Transactional fact table capturing order amounts and payment status."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id